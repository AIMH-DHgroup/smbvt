<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
	<title>Sketchfab Event Editor</title>
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #111;
		}

		#sketchfabEditorFrame {
			width: 100%;
			height: 100%;
			border: 0;
			display: block;
		}

		#sketchfabEditorStatus {
			position: fixed;
			left: 12px;
			bottom: 12px;
			z-index: 20;
			max-width: calc(100% - 24px);
			padding: 8px 10px;
			border-radius: 12px;
			background: rgba(0, 0, 0, 0.65);
			color: #fff;
			font: 13px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			pointer-events: none;
		}

		#sketchfabEditorStatus[data-state="ready"] {
			display: none;
		}

		#sketchfabAnnotationControls {
			position: fixed;
			left: 50%;
			bottom: 12px;
			transform: translateX(-50%);
			z-index: 30;
			display: flex;
			gap: 8px;
			padding: 8px 10px;
			border-radius: 12px;
			background: rgba(0, 0, 0, 0.65);
			-webkit-backdrop-filter: blur(8px);
			backdrop-filter: blur(8px);
			display: none
		}
	</style>
</head>
<body>
	<iframe id="sketchfabEditorFrame" title="Sketchfab annotation selector" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
	<div id="sketchfabEditorStatus">Loading Sketchfab model...</div>
	<div id="sketchfabAnnotationControls">
		<button id="sketchfabEditorPrevAnnotation" type="button" class="btn btn-light btn-sm" title="Previous annotation">&lt;</button>
		<button id="sketchfabEditorNextAnnotation" type="button" class="btn btn-light btn-sm" title="Next annotation">&gt;</button>
	</div>
	<script type="text/javascript" src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
	<script src="sketchfab-event-viewer.js"></script>
</body>
</html>
